<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste WebSocket</title>
</head>

<body>

    <h1>Teste WebSocket</h1>

    <input id="email" type="email" placeholder="E-mail">
    <input id="password" type="password" placeholder="Senha">
    <button id="login">Login</button>

    <hr>

    <button id="joinChat">Entrar no Chat</button>
    <button id="sendMessage">Enviar mensagem</button>

    <script>
        let socket;

        document.getElementById("login").addEventListener("click", async () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("http://127.0.0.1:3000/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                console.log("Login:", data);

                if (!response.ok) {
                    return;
                }

                console.log("Login realizado!");

                // Agora abre o WebSocket.
                // O navegador enviará automaticamente o accessToken
                // que foi salvo no cookie.
                socket = new WebSocket("ws://127.0.0.1:3000");

                socket.onopen = () => {
                    console.log("WebSocket conectado!");
                };

                socket.onmessage = (event) => {
                    const message = JSON.parse(event.data);

                    console.log("Mensagem recebida:", message);

                    if (message.event === "friendRequest") {
                        console.log("🔔 Nova solicitação de amizade!");
                    }
                };

                socket.onclose = () => {
                    console.log("WebSocket desconectado!");
                };

                socket.onerror = (error) => {
                    console.error("Erro no WebSocket:", error);
                };

            } catch (error) {
                console.error("Erro no login:", error);
            }
        });

        document.getElementById("joinChat").addEventListener("click", () => {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                console.log("WebSocket não está conectado.");
                return;
            }

            socket.send(JSON.stringify({
                event: "joinChat",
                chatId: 123
            }));

            console.log("Entrando no chat...");
        });

        document.getElementById("sendMessage").addEventListener("click", () => {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                console.log("WebSocket não está conectado.");
                return;
            }

            socket.send(JSON.stringify({
                event: "sendMessage",
                chatId: 123,
                content: "Olá, chat!"
            }));

            console.log("Mensagem enviada!");
        });
    </script>

</body>

</html>
